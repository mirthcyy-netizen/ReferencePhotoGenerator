<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Generate Feature Probe</title>
  </head>
  <body>
    <iframe id="probeFrame" src="/index.html?test=generate-flow" style="width: 1280px; height: 1200px; border: 0"></iframe>
    <pre id="output">waiting</pre>
    <script>
      const frame = document.querySelector("#probeFrame");
      const wait = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

      function centerPixel(doc) {
        const canvas = doc.querySelector("#studyCanvas");
        const context = canvas.getContext("2d", { willReadFrequently: true });
        const data = context.getImageData(Math.floor(canvas.width / 2), Math.floor(canvas.height / 2), 1, 1).data;
        return Array.from(data);
      }

      function isMostlyRed(pixel) {
        return pixel[0] > 180 && pixel[1] < 120 && pixel[2] < 120;
      }

      function variationCardState(doc) {
        return Array.from(doc.querySelectorAll(".variation-card")).map((card) => {
          const image = card.querySelector("img");
          return {
            type: card.dataset.variation,
            disabled: card.disabled,
            hasImage: !image.hidden && image.src.startsWith("data:image/png;base64,"),
            state: card.querySelector(".variation-state").textContent,
          };
        });
      }

      function paletteState(doc) {
        return {
          name: doc.querySelector("#paletteName").textContent,
          colors: Array.from(doc.querySelectorAll("#paletteSwatches .swatch")).map((swatch) => swatch.title),
        };
      }

      function paintabilityState(doc) {
        return {
          score: Number(doc.querySelector("#paintabilityScore").textContent),
          label: doc.querySelector("#scoreLabel").textContent,
          breakdown: Object.fromEntries(
            Array.from(doc.querySelectorAll("[data-paintability-row]")).map((row) => [
              row.dataset.paintabilityRow,
              Number(row.querySelector("strong").textContent),
            ]),
          ),
        };
      }

      function choiceValues(doc, selector) {
        return Array.from(doc.querySelectorAll(`${selector} .choice-button`)).map((button) => button.dataset.value);
      }

      function presetNames(doc) {
        return Array.from(doc.querySelectorAll("#presetGrid .preset-button")).map((button) => button.dataset.preset);
      }

      function selectValues(doc, selector) {
        return Array.from(doc.querySelector(selector).options).map((option) => option.value);
      }

      function canvasChannelRange(doc) {
        const canvas = doc.querySelector("#studyCanvas");
        const context = canvas.getContext("2d", { willReadFrequently: true });
        const data = context.getImageData(0, 0, canvas.width, canvas.height).data;
        const min = [255, 255, 255];
        const max = [0, 0, 0];

        for (let index = 0; index < data.length; index += 4) {
          for (let channel = 0; channel < 3; channel += 1) {
            min[channel] = Math.min(min[channel], data[index + channel]);
            max[channel] = Math.max(max[channel], data[index + channel]);
          }
        }

        return Math.max(max[0] - min[0], max[1] - min[1], max[2] - min[2]);
      }

      async function waitUntil(check, timeout = 3000) {
        const started = Date.now();
        while (Date.now() - started < timeout) {
          const result = check();
          if (result) return result;
          await wait(50);
        }
        return check();
      }

      frame.addEventListener("load", async () => {
        const doc = frame.contentDocument;
        const form = doc.querySelector("#generatorForm");
        const status = () => doc.querySelector("#generationStatus").textContent;

        doc.querySelector('#subjectGrid [data-value="Seascape"]').click();
        const guidedState = {
          styles: choiceValues(doc, "#styleGrid"),
          presets: presetNames(doc),
          lighting: selectValues(doc, "#lightingSelect"),
          composition: selectValues(doc, "#compositionSelect"),
          pose: selectValues(doc, "#poseSelect"),
          status: doc.querySelector("#compatibilityStatus").textContent,
        };

        doc.querySelector('#styleGrid [data-value="Plein air"]').click();
        doc.querySelector("#lightingSelect").value = "Dramatic side light";
        form.requestSubmit();
        await waitUntil(() => status().includes("Generated new reference") && isMostlyRed(centerPixel(doc)), 10000);
        const firstStatus = status();
        const firstPixel = centerPixel(doc);
        const firstPalette = paletteState(doc);
        const firstPaintability = paintabilityState(doc);
        const firstCanvasChannelRange = canvasChannelRange(doc);
        const cardsAfterGenerate = variationCardState(doc);

        doc.querySelector('[data-variation="lighting"]').click();
        await wait(200);
        const statusAfterPausedClick = status();
        const pixelAfterPausedClick = centerPixel(doc);
        const cardsAfterPausedClick = variationCardState(doc);

        const requestLog = await fetch("/test/requests").then((response) => response.json());
        const output = {
          firstStatus,
          statusAfterPausedClick,
          notice: doc.querySelector("#generateNotice").textContent,
          firstPixel,
          pixelAfterPausedClick,
          firstCanvasChannelRange,
          firstPalette,
          firstPaintability,
          guidedState,
          cardsAfterGenerate,
          cardsAfterPausedClick,
          requestCount: requestLog.length,
          requestIds: requestLog.map((item) => item.requestId),
          variationTypes: requestLog.map((item) => item.variationType),
          hasSourceImages: requestLog.map((item) => Boolean(item.sourceImageDataUrl)),
          sizes: requestLog.map((item) => item.size),
          promptSamples: requestLog.map((item) => item.prompt.slice(0, 80)),
        };
        document.querySelector("#output").textContent = JSON.stringify(output, null, 2);
      });
    </script>
  </body>
</html>
